<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — শতবর্ষী স্মারক পরিচিতিপত্র</title>
  <meta name="robots" content="noindex,nofollow">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Hind Siliguri', system-ui, -apple-system, sans-serif;
      background: #0a0f1a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .header {
      max-width: 1200px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: linear-gradient(145deg, #0f172a, #0a1020);
      border: 2px solid rgba(245, 158, 11, 0.4);
      border-radius: 16px;
      padding: 18px 22px;
    }

    .header h1 {
      font-size: 20px;
      color: #fbbf24;
      font-weight: 800;
    }

    .header h1 span { color: #f59e0b; }

    .stats {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat .num {
      font-size: 22px;
      font-weight: 800;
      color: #fbbf24;
    }

    .stat .lbl {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .controls {
      max-width: 1200px;
      margin: 0 auto 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls input,
    .controls select {
      flex: 1;
      min-width: 150px;
      background: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      color: #f8fafc;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .controls input:focus,
    .controls select:focus { border-color: #f59e0b; }

    .controls button {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    .controls button:hover { opacity: 0.9; }

    .table-wrap {
      max-width: 1200px;
      margin: 0 auto;
      background: #0f172a;
      border: 1.5px solid rgba(245, 158, 11, 0.3);
      border-radius: 16px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 800px;
    }

    th {
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
      font-weight: 800;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 2px solid rgba(245, 158, 11, 0.3);
      position: sticky;
      top: 0;
    }

    td {
      padding: 11px 14px;
      border-bottom: 1px solid rgba(71, 85, 105, 0.4);
      color: #e2e8f0;
      vertical-align: middle;
    }

    tr:hover { background: rgba(245, 158, 11, 0.04); }

    /* ============================================================
       PHONE COLUMN — call + WhatsApp quick actions
       ============================================================ */
    .phone-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .phone-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      text-decoration: none;
      font-size: 14px;
      line-height: 1;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }

    .phone-link:hover {
      transform: scale(1.1);
    }

    .phone-link:active {
      transform: scale(0.9);
    }

    .phone-call {
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.6);
    }

    .phone-call:hover {
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    }

    .phone-wa {
      background: rgba(34, 197, 94, 0.18);
      border: 1px solid rgba(34, 197, 94, 0.6);
    }

    .phone-wa:hover {
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
    }

    .phone-num {
      font-size: 12.5px;
      color: #cbd5e1;
      font-weight: 600;
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
    }

    .card-thumb {
      width: 60px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .lang-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .lang-bn { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .lang-hi { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .lang-en { background: rgba(168, 85, 247, 0.2); color: #c084fc; }

    .login-box {
      max-width: 400px;
      margin: 80px auto;
      background: linear-gradient(145deg, #0f172a, #0a1020);
      border: 2px solid rgba(245, 158, 11, 0.4);
      border-radius: 20px;
      padding: 32px 26px;
      text-align: center;
    }

    .login-box h2 {
      color: #fbbf24;
      font-size: 20px;
      margin-bottom: 6px;
    }

    .login-box p {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      background: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 12px;
      padding: 13px 16px;
      color: #f8fafc;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
    }

    .login-box input:focus { border-color: #f59e0b; }

    .login-box button {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }

    .login-error {
      color: #f87171;
      font-size: 13px;
      margin-top: 10px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .header h1 { font-size: 16px; }
      .stat .num { font-size: 18px; }
      th, td { padding: 8px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <div id="loginView">
    <div class="login-box">
      <h2>🔐 Admin Login</h2>
      <p>শুধু অ্যাডমিন এই পেজ দেখতে পারবেন</p>
      <input type="password" id="passwordInput" placeholder="পাসওয়ার্ড দিন" />
      <button onclick="login()">লগইন করুন</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div id="dashboardView" style="display:none;">
    <div class="header">
      <h1>🚩 শতবর্ষী স্মারক পরিচিতিপত্র <span>| অ্যাডমিন</span></h1>
      <div class="stats">
        <div class="stat">
          <div class="num" id="totalCards">0</div>
          <div class="lbl">মোট কার্ড</div>
        </div>
        <div class="stat">
          <div class="num" id="todayCards">0</div>
          <div class="lbl">আজ</div>
        </div>
        <div class="stat">
          <div class="num" id="bnCount">0</div>
          <div class="lbl">বাংলা</div>
        </div>
        <div class="stat">
          <div class="num" id="hiCount">0</div>
          <div class="lbl">হিন্দি</div>
        </div>
        <div class="stat">
          <div class="num" id="enCount">0</div>
          <div class="lbl">English</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍 নাম বা ধাম দিয়ে খুঁজুন..." oninput="renderTable()" />
      <select id="langFilter" onchange="renderTable()">
        <option value="">সব ভাষা</option>
        <option value="bn">বাংলা</option>
        <option value="hi">হিন্দি</option>
        <option value="en">English</option>
      </select>
      <button onclick="downloadCSV()">📥 CSV ডাউনলোড</button>
      <button onclick="logout()">লগআউট</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>ছবি</th>
            <th>নাম</th>
            <th>ধাম</th>
            <th>শাখা</th>
            <th>পেশা</th>
            <th>বর্গ</th>
            <th>সংঘায়ু</th>
            <th>মোবাইল</th>
            <th>ভাষা</th>
            <th>তারিখ</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="11" class="empty">লোড হচ্ছে...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allCards = [];
    let adminPassword = '';

    function login() {
      const pwd = document.getElementById('passwordInput').value;
      if (!pwd) {
        document.getElementById('loginError').textContent = 'পাসওয়ার্ড দিন';
        return;
      }
      adminPassword = pwd;
      loadData();
    }

    function logout() {
      adminPassword = '';
      allCards = [];
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('loginView').style.display = 'block';
      document.getElementById('passwordInput').value = '';
      document.getElementById('loginError').textContent = '';
    }

    async function loadData() {
      try {
        const res = await fetch('/api/admin?password=' + encodeURIComponent(adminPassword));
        const data = await res.json();

        if (!res.ok || !data.ok) {
          document.getElementById('loginError').textContent = 'ভুল পাসওয়ার্ড বা সার্ভার সমস্যা';
          return;
        }

        allCards = data.cards || [];
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'block';

        updateStats();
        renderTable();
      } catch (err) {
        document.getElementById('loginError').textContent = 'সংযোগ ব্যর্থ। আবার চেষ্টা করুন।';
        console.error(err);
      }
    }

    function updateStats() {
      document.getElementById('totalCards').textContent = allCards.length;

      const today = new Date().toISOString().slice(0, 10);
      const todayCount = allCards.filter(c => 
        c.terms_accepted_at && c.terms_accepted_at.slice(0, 10) === today
      ).length;
      document.getElementById('todayCards').textContent = todayCount;

      document.getElementById('bnCount').textContent = allCards.filter(c => c.lang === 'bn').length;
      document.getElementById('hiCount').textContent = allCards.filter(c => c.lang === 'hi').length;
      document.getElementById('enCount').textContent = allCards.filter(c => c.lang === 'en').length;
    }

    function renderTable() {
      const search = (document.getElementById('searchInput').value || '').toLowerCase();
      const langFilter = document.getElementById('langFilter').value;

      let filtered = allCards.filter(c => {
        const matchesSearch = !search || 
          (c.full_name || '').toLowerCase().includes(search) ||
          (c.dham || '').toLowerCase().includes(search) ||
          (c.shakha || '').toLowerCase().includes(search);
        const matchesLang = !langFilter || c.lang === langFilter;
        return matchesSearch && matchesLang;
      });

      const tbody = document.getElementById('tableBody');

      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="11" class="empty">কোনো কার্ড পাওয়া যায়নি</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map((c, i) => {
        const date = c.terms_accepted_at 
          ? new Date(c.terms_accepted_at).toLocaleString('bn-BD', { 
              year: 'numeric', month: 'short', day: 'numeric',
              hour: '2-digit', minute: '2-digit'
            })
          : '—';
        const langClass = c.lang === 'bn' ? 'lang-bn' : c.lang === 'hi' ? 'lang-hi' : 'lang-en';
        const langLabel = c.lang === 'bn' ? 'বাংলা' : c.lang === 'hi' ? 'হিন্দি' : 'English';
        const img = c.image_url 
          ? `<img src="${c.image_url}" class="card-thumb" loading="lazy" />` 
          : '—';

        // Phone column — clickable tel + WhatsApp links
        const phoneRaw = (c.whatsapp_number || '').replace(/\D/g, '');
        const phoneDisplay = phoneRaw
          ? `<div class="phone-cell">
               <a href="tel:+91${phoneRaw}" class="phone-link phone-call" title="Call">📞</a>
               <a href="https://wa.me/91${phoneRaw}" target="_blank" rel="noopener" class="phone-link phone-wa" title="WhatsApp">💬</a>
               <span class="phone-num">${phoneRaw}</span>
             </div>`
          : '—';

        return `
          <tr>
            <td>${i + 1}</td>
            <td>${img}</td>
            <td><strong>${escapeHtml(c.full_name || '—')}</strong></td>
            <td>${escapeHtml(c.dham || '—')}</td>
            <td>${escapeHtml(c.shakha || '—')}</td>
            <td>${escapeHtml(c.kaam || '—')}</td>
            <td>${escapeHtml(c.barga || '—')}</td>
            <td>${escapeHtml(String(c.sanghayu || '—'))}</td>
            <td>${phoneDisplay}</td>
            <td><span class="lang-tag ${langClass}">${langLabel}</span></td>
            <td>${date}</td>
          </tr>
        `;
      }).join('');
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function downloadCSV() {
      if (!allCards.length) {
        alert('কোনো ডেটা নেই');
        return;
      }
      const headers = ['Card ID', 'Name', 'Dham', 'Shakha', 'Kaam', 'Barga', 'Role', 'Sanghayu', 'Lang', 'Date'];
      const rows = allCards.map(c => [
        c.card_id, c.full_name, c.dham, c.shakha, c.kaam, c.barga, c.role, c.sanghayu, c.lang, c.terms_accepted_at
      ]);
      const csv = [headers, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'shatabdi-cards-' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('passwordInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
